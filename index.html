<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="titlediv">
        <a href="https://www.dominionmovement.com/watch" class="titlelink">Rock Paper Scissors</a>
    </div>
    <div class="results">
        <div class="eachResults">
            <h2 class="resultsTitle">Computer Choice</h2>
            <div class="imagesdiv"><img class="computerImage"></div>
            <p></p>
        </div>
        <div class="eachResults">
            <h2 class="resultsTitle">Your Choice</h2>
            <div class="imagesdiv"><img class="humanImage"></div>
            <p></p>
        </div>
    </div>
    <div class="buttons">
    <button class="button" id="rock">ROCK</button>
    <button class="button" id="paper">PAPER</button>
    <button class="button" id="scissors">SCISSORS</button>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
